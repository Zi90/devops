# ---------------------------------------------------------------
# 7주차: 방명록 = nginx(문지기) + web x3(앱) + redis(DB)
#   브라우저 :8080 → nginx → web(3개 중 하나) → redis
#   실행:  docker compose up -d
#   검사:  docker compose config --quiet && echo OK
# ---------------------------------------------------------------
services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"                    # 바깥으로 열린 문은 nginx 하나뿐
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy   # web이 healthy가 된 뒤에 시작
    restart: always

  web:
    build: .
    expose:
      - "5000"                       # 호스트에 공개하지 않음 (nginx만 접근)
    environment:
      APP_TITLE: "Edwin의 방명록"
      THEME_COLOR: "#7C3AED"
      REDIS_HOST: "redis"            # IP가 아니라 서비스 이름 (도커 내부 DNS)
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?비밀번호 설정 필요}"   # 값은 .env에서
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request;
        urllib.request.urlopen(
        'http://localhost:5000/readyz')"]   # Redis 연결이 안 되면 503 → 실패
      interval: 5s
      timeout: 3s
      retries: 5
    # [중간과제 4번] web=3을 항상 유지하기 위한 설정
    deploy:
      replicas: 3                    # --scale 없이 up만 해도 web 3개
    restart: always                  # 앱이 죽거나 도커/PC가 재시작돼도 다시 실행
    develop:
      watch:
        - action: rebuild
          path: ./app.py
        - action: rebuild
          path: ./templates

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data             # 컨테이너를 지워도 데이터는 볼륨에 남음
    healthcheck:
      test:
        - CMD-SHELL
        - "REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli --raw ping | grep -qx PONG"
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

volumes:
  redis-data:
